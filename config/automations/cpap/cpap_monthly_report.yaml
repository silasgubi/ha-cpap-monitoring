# =============================================================================
# CPAP Monitoring — Monthly report (User1)
# =============================================================================
# Sends a monthly usage summary to the family Telegram group on day 1,
# mirroring the structure of Resmed's own myAir PDF report (average usage,
# average AHI, average mask leak, % of nights ≥4h/≥6h), using the totals
# accumulated night by night by cpap_month_accumulate.yaml. Resets those
# totals afterwards so the next month starts from zero.
#
# When there's data for the month, the message text is written fresh by
# Gemini (ai_task.generate_data, same AI Task entity as user1_morning_summary.yaml
# and telegram_family_summary.yaml), using the real averages below as facts
# it may not alter. Falls back to the original fixed template if the AI call
# fails or isn't configured. The "no data this month" case never calls the
# AI — it's a fixed message either way. See docs/installation-guide.md
# section "AI-personalized morning summary" for setup.
# =============================================================================

- id: cpap_monthly_report
  alias: "CPAP — Monthly Report (User1)"
  description: >
    Monthly Telegram summary of Maria's CPAP usage, sent on the 1st of
    each month using totals accumulated by cpap_month_accumulate.yaml.
  mode: single
  trigger:
    - platform: time
      at: "08:40:00"
  condition:
    - condition: template
      value_template: "{{ now().day == 1 }}"
  action:
    - variables:
        nights: "{{ states('input_number.cpap_month_nights_count') | float(0) }}"
        start_raw: "{{ states('input_text.cpap_month_period_start') }}"
        end_raw: "{{ states('sensor.most_recent_sleep_date') }}"
    - variables:
        avg_h: >
          {%- if nights > 0 -%}
          {{ ((states('input_number.cpap_month_usage_minutes_sum') | float(0) / nights) / 60) | int }}
          {%- else -%}0{%- endif -%}
        avg_m: >
          {%- if nights > 0 -%}
          {{ ((states('input_number.cpap_month_usage_minutes_sum') | float(0) / nights) % 60) | round(0) | int }}
          {%- else -%}0{%- endif -%}
        avg_ahi: >
          {%- if nights > 0 -%}
          {{ (states('input_number.cpap_month_ahi_sum') | float(0) / nights) | round(1) }}
          {%- else -%}0{%- endif -%}
        avg_leak: >
          {%- if nights > 0 -%}
          {{ (states('input_number.cpap_month_leak_sum') | float(0) / nights) | round(1) }}
          {%- else -%}0{%- endif -%}
        ge4h: "{{ states('input_number.cpap_month_nights_ge4h') | float(0) | int }}"
        ge6h: "{{ states('input_number.cpap_month_nights_ge6h') | float(0) | int }}"
        pct4h: >
          {%- if nights > 0 -%}
          {{ (states('input_number.cpap_month_nights_ge4h') | float(0) / nights * 100) | round(0) | int }}
          {%- else -%}0{%- endif -%}
        pct6h: >
          {%- if nights > 0 -%}
          {{ (states('input_number.cpap_month_nights_ge6h') | float(0) / nights * 100) | round(0) | int }}
          {%- else -%}0{%- endif -%}
        start_fmt: "{{ (start_raw | as_datetime | as_local).strftime('%d/%m/%Y') if start_raw not in ['unknown', 'unavailable', ''] else 'data indisponível' }}"
        end_fmt: "{{ (end_raw | as_datetime | as_local).strftime('%d/%m/%Y') if end_raw not in ['unknown', 'unavailable'] else 'data indisponível' }}"
    - choose:
        - conditions: "{{ nights > 0 }}"
          sequence:
            - action: ai_task.generate_data
              continue_on_error: true
              data:
                entity_id: ai_task.YOUR_AI_TASK_ENTITY  # REPLACE: see docs/installation-guide.md
                task_name: cpap_monthly_report
                instructions: >
                  Você escreve o resumo mensal de uso do CPAP da Maria para
                  a família, enviado no grupo de Telegram no dia 1 de cada
                  mês. Use apenas os dados reais abaixo — não invente nenhum
                  número ou fato clínico adicional:

                  - Período: {{ start_fmt }} a {{ end_fmt }} ({{ nights | int }} noites com dados)
                  - Uso médio por noite: {{ avg_h }}h {{ avg_m }}min
                  - IAH médio: {{ avg_ahi }} eventos/hora
                  - Vazamento médio: {{ avg_leak }} L/min
                  - Noites com uso ≥4h: {{ ge4h }} de {{ nights | int }} ({{ pct4h }}%)
                  - Noites com uso ≥6h: {{ ge6h }} de {{ nights | int }} ({{ pct6h }}%)
                  {% if nights < 25 %}- Atenção: o período teve menos de 25 noites com dados, então a média pode não representar o mês completo.{% endif %}

                  Quem lê o grupo são os FILHOS da Maria, não ela. Fale
                  SOBRE a Maria, sempre em terceira pessoa, e nunca se
                  dirija a ela (nada de "Maria, tente..." ou "você
                  usou"). Qualquer sugestão é para os filhos, dizendo o que
                  eles podem fazer por ela.

                  Escreva em português do Brasil, tom natural e caloroso,
                  como um irmão resumindo o mês para os outros irmãos no
                  grupo, variando a forma de dizer a cada vez. Estrutura:
                  um título curto citando "Relatório mensal CPAP de Maria"
                  e o período, os números principais de forma legível, e um
                  comentário breve avaliando a adesão do mês (por exemplo,
                  se a maioria das noites teve uso ≥6h, ou se caiu abaixo do
                  recomendado). Pode usar 1 a 2 emojis e negrito simples com
                  asteriscos (*assim*, nunca dois), sem exagero. Não use
                  listas com marcadores — texto corrido, no máximo 6 linhas.
                  Responda com UMA única versão da mensagem, sem oferecer
                  alternativas.
              response_variable: ai_summary
    - action: telegram_bot.send_message
      data:
        chat_id: REPLACE_WITH_FAMILY_CHAT_ID  # REPLACE: family Telegram group ID (negative number)
        message: >
          {%- if nights > 0 -%}
            {%- if ai_summary is defined and ai_summary.data is defined and (ai_summary.data | trim) != '' -%}
          {{ ai_summary.data | trim }}
            {%- else -%}
          📋 Relatório mensal CPAP de Maria
          Período: {{ start_fmt }} a {{ end_fmt }} ({{ nights | int }} noites com dados)

          Uso médio: {{ avg_h }}h {{ avg_m }}min
          IAH médio: {{ avg_ahi }} eventos/hora
          Vazamento médio: {{ avg_leak }} L/min
          Dias de uso ≥4h: {{ ge4h }}/{{ nights | int }} ({{ pct4h }}%)
          Dias de uso ≥6h: {{ ge6h }}/{{ nights | int }} ({{ pct6h }}%)
          {%- if nights < 25 %}

          Atenção: período com menos de um mês completo de dados acumulados.
          {%- endif -%}
            {%- endif -%}
          {%- else -%}
          📋 Relatório mensal CPAP de Maria

          Nenhum dado acumulado neste período. Verifique se a sincronização do myAir está funcionando.
          {%- endif -%}

    # Guard against wiping real accumulated data: a manual
    # automation.trigger (e.g. to test the AI-generated message) skips the
    # automation-level `condition:` above but still runs this action
    # sequence. Without this check it would zero the monthly totals on any
    # day, not just the 1st. The message still sends on a manual trigger
    # (useful for testing); only the reset below is gated.
    - condition: template
      value_template: "{{ now().day == 1 }}"

    - action: input_number.set_value
      target:
        entity_id: input_number.cpap_month_usage_minutes_sum
      data:
        value: 0
    - action: input_number.set_value
      target:
        entity_id: input_number.cpap_month_ahi_sum
      data:
        value: 0
    - action: input_number.set_value
      target:
        entity_id: input_number.cpap_month_leak_sum
      data:
        value: 0
    - action: input_number.set_value
      target:
        entity_id: input_number.cpap_month_nights_count
      data:
        value: 0
    - action: input_number.set_value
      target:
        entity_id: input_number.cpap_month_nights_ge4h
      data:
        value: 0
    - action: input_number.set_value
      target:
        entity_id: input_number.cpap_month_nights_ge6h
      data:
        value: 0
