# Low usage alert
- id: cpap_user2_usage_alert
  alias: "CPAP User2 — Low Usage Alert"
  mode: restart
  trigger:
    - platform: state
      entity_id: sensor.most_recent_sleep_date_2
  condition:
    - condition: state
      entity_id: input_boolean.cpap_alerts_user2
      state: "on"
    - condition: state
      entity_id: binary_sensor.cpap_user2_usage_alert
      state: "on"
    - condition: time
      after: "07:00:00"
      before: "22:00:00"
  action:
    - action: notify.mobile_app_YOUR_PHONE
      data:
        title: "CPAP João — Uso baixo"
        message: >
          Você usou o CPAP por apenas
          {{ (states('sensor.cpap_usage_minutes_2') | float(0) / 60) | round(1) }} horas
          na noite de {{ states('sensor.most_recent_sleep_date_2') }}.
          Mínimo recomendado: 4 horas.
    - action: persistent_notification.create
      data:
        title: "CPAP João — Uso baixo"
        message: >
          Você usou o CPAP por apenas
          {{ (states('sensor.cpap_usage_minutes_2') | float(0) / 60) | round(1) }} horas
          na noite de {{ states('sensor.most_recent_sleep_date_2') }}.
          Mínimo recomendado: 4 horas.
        notification_id: cpap_user2_usage_alert
    # Speech only when Do Not Disturb is off (no DND off/on cycle anymore)
    - if:
        - condition: state
          entity_id: input_boolean.YOUR_DO_NOT_DISTURB
          state: "off"
      then:
        - action: notify.send_message
          # Alexa offline must not block the push below
          continue_on_error: true
          data:
            message: João, você usou o CPAP por pouco tempo na última noite. Tente usar por pelo menos 4 horas.
          target:
            entity_id: notify.USER2_ECHO_announce
