# =============================================================================
# CPAP Monitoring — João alert automations
# =============================================================================
# Triggered when new nightly data arrives (most_recent_sleep_date_2 changes).
# Each alert: push notification to iPhone + HA persistent notification + Alexa TTS.
# Alexa TTS only plays while input_boolean.YOUR_DO_NOT_DISTURB is off; push and
# persistent notification always go out. These automations never touch the
# Alexa's native DND switch: the Do Not Disturb automation is its only owner
# (turning it back on here used to re-enable DND even when Do Not Disturb was off).
# =============================================================================

# AHI alert
- id: cpap_user2_ahi_alert
  alias: "CPAP User2 — AHI Alert"
  mode: restart
  trigger:
    - platform: state
      entity_id: sensor.most_recent_sleep_date_2
  condition:
    - condition: state
      entity_id: input_boolean.cpap_alerts_user2
      state: "on"
    - condition: state
      entity_id: binary_sensor.cpap_user2_ahi_alert
      state: "on"
    - condition: time
      after: "07:00:00"
      before: "22:00:00"
  action:
    - action: notify.mobile_app_YOUR_PHONE
      data:
        title: "CPAP João — AHI elevado"
        message: >
          AHI de {{ states('sensor.cpap_ahi_events_per_hour_2') | round(1) }} ev/h
          na noite de {{ states('sensor.most_recent_sleep_date_2') }}.
          Verifique o ajuste da máscara.
    - action: persistent_notification.create
      data:
        title: "CPAP João — AHI elevado"
        message: >
          AHI de {{ states('sensor.cpap_ahi_events_per_hour_2') | round(1) }} ev/h
          na noite de {{ states('sensor.most_recent_sleep_date_2') }}.
          Verifique o ajuste da máscara.
        notification_id: cpap_user2_ahi_alert
    # Speech only when Do Not Disturb is off (no DND off/on cycle anymore)
    - if:
        - condition: state
          entity_id: input_boolean.YOUR_DO_NOT_DISTURB
          state: "off"
      then:
        - action: notify.send_message
          # Alexa offline must not block the push below
          continue_on_error: true
          data:
            message: João, o seu CPAP registrou muitos eventos de apneia na última noite. Verifique o ajuste da máscara.
          target:
            entity_id: notify.USER2_ECHO_announce

