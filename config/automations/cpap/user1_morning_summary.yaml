# =============================================================================
# CPAP Monitoring — Morning summary automation
# =============================================================================
# Reads Maria's CPAP nightly report via Alexa TTS at 08:30.
# Skips if data is older than 2 days (device offline or no cloud sync).
# Announces on both Echo Shows in Maria's home.
#
# Late data: the myAir cloud sync only happens after she turns the machine off,
# so on late mornings last night's data isn't there at 08:30. The summary tries
# again at 09:30 and 10:30 and speaks at most once per day. After that it can
# still be requested on demand by firing the event `cpap_summary_request` with
# `moment: night` (e.g. from a bedtime routine): it then says good night and
# speaks only on the bedroom Echo Show.
#
# The spoken text is written fresh each day by Gemini (HA's Google Generative
# AI Conversation integration, via the ai_task.generate_data action), using
# the real numbers below as facts it may not alter. If that call fails or the
# integration isn't set up, the automation falls back to the original fixed
# phrasing — TTS delivery is never skipped. See docs/installation-guide.md
# section "AI-personalized morning summary" for setup.
# =============================================================================

- id: cpap_morning_summary
  alias: "CPAP — Morning Summary"
  description: >
    Daily 08:30 TTS summary of Maria's previous night CPAP session, retried
    at 09:30 and 10:30 if the data is late (once per day); can also be
    requested at night via the cpap_summary_request event.
    Reports usage, AHI, mask leak, and myAir score; flags out-of-range metrics.
    Phrasing is generated by Gemini (with a fixed-text fallback).
  mode: single
  trigger:
    - platform: time
      at: "08:30:00"
    - platform: time
      at: "09:30:00"
    - platform: time
      at: "10:30:00"
    - platform: event
      event_type: cpap_summary_request
      id: request
  condition:
    # Once per day: retries and night requests are skipped after it has spoken.
    - condition: template
      value_template: >
        {% set t = this.attributes.last_triggered %}
        {{ t is none or (t | as_datetime | as_local).date() != now().date() }}
    - condition: state
      entity_id: input_boolean.cpap_alerts_user1
      state: "on"
    - condition: template
      value_template: >
        {% set last = states('sensor.most_recent_sleep_date') %}
        {% if last in ['unknown', 'unavailable'] %}
          false
        {% else %}
          {{ (now().date() - (last | as_datetime | as_local).date()).days <= 1 }}
        {% endif %}
  action:
    - variables:
        night: "{{ trigger.id == 'request' and trigger.event.data.moment | default('') == 'night' }}"
        hours: "{{ (states('sensor.cpap_usage_minutes') | float(0) / 60) | round(1) }}"
        ahi: "{{ states('sensor.cpap_ahi_events_per_hour') | float(0) | round(1) }}"
        leak: "{{ states('sensor.cpap_mask_leak') | float(0) | round(1) }}"
        ahi_alert: "{{ is_state('binary_sensor.cpap_user1_ahi_alert', 'on') }}"
        leak_alert: "{{ is_state('binary_sensor.cpap_user1_leak_alert', 'on') }}"
        usage_alert: "{{ is_state('binary_sensor.cpap_user1_usage_alert', 'on') }}"
    - action: ai_task.generate_data
      continue_on_error: true
      data:
        entity_id: ai_task.YOUR_AI_TASK_ENTITY  # REPLACE: see docs/installation-guide.md
        task_name: cpap_morning_summary
        instructions: >
          Você escreve um "{{ 'boa noite' if night else 'bom dia' }}" que será
          falado em voz alta por um dispositivo Alexa para Maria, uma senhora
          que usa CPAP para tratar apneia do sono.
          {% if night %}Ela está indo dormir agora; os dados são da noite
          passada, que só chegaram no fim da manhã, então fale da noite passada.
          Não termine com "durma bem": outro recado vem logo depois.
          {% endif %}Use apenas os dados reais abaixo — não invente
          nenhum número, sintoma ou recomendação clínica além do que está
          listado:

          - Horas de uso do CPAP {{ 'na noite passada' if night else 'ontem à noite' }}: {{ hours }}h
          - IAH (eventos de apneia por hora): {{ ahi }}
          - Vazamento de máscara: {{ leak }} L/min
          - Alerta de pouco tempo de uso: {{ 'sim' if usage_alert else 'não' }}
          - Alerta de vazamento de máscara: {{ 'sim' if leak_alert else 'não' }}
          - Alerta de eventos de apneia: {{ 'sim' if ahi_alert else 'não' }}

          Escreva de 2 a 3 frases em português do Brasil, tom caloroso e
          natural, como se fosse dito por um familiar — variando a forma de
          dizer a cada vez, sem soar repetitivo. Comece cumprimentando "{{ 'Boa
          noite' if night else 'Bom dia' }}, Maria!". Se algum alerta acima for "sim", explique com
          gentileza o cuidado a tomar (ajustar a máscara, usar por mais
          tempo) e diga para falar com um dos filhos em caso de dúvida. Se
          nenhum alerta for "sim", parabenize pela boa noite de sono. Não
          use markdown, emojis nem listas — apenas o texto corrido que será
          falado. Responda com UMA única versão do texto, sem oferecer
          alternativas.
      response_variable: ai_summary
    - action: notify.send_message
      data:
        message: >
          {%- if ai_summary is defined and ai_summary.data is defined and (ai_summary.data | trim) != '' -%}
          {{ ai_summary.data | trim }}
          {%- else -%}
          {{ 'Boa noite' if night else 'Bom dia' }}, Maria!
          {% if usage_alert or leak_alert or ahi_alert %}
            O seu CPAP registrou algo diferente {{ 'na noite passada' if night else 'esta noite' }}.
            {% if usage_alert %}Você usou a máscara por pouco tempo. Tente dormir com ela por mais horas.{% endif %}
            {% if leak_alert %}A máscara pode estar com vazamento. Ajuste as tiras antes de dormir.{% endif %}
            {% if ahi_alert %}Você teve alguns eventos de apneia. Verifique se a máscara está bem encaixada.{% endif %}
            Em caso de dúvidas, fale com um de seus filhos.
          {% else %}
            O seu CPAP funcionou bem {{ 'na noite passada' if night else 'esta noite' }}. Você teve uma boa noite de sono!
          {% endif %}
          {%- endif %}
      target:
        # At night only the bedroom Echo Show.
        entity_id: >
          {{ ['notify.USER1_ECHO_2_announce'] if night else
             ['notify.USER1_ECHO_1_announce', 'notify.USER1_ECHO_2_announce'] }}
