# =============================================================================
# CPAP Monitoring System — HA Package
# =============================================================================
# Drop this file into your config/packages/ directory.
# Requires: homeassistant: packages: !include_dir_named packages/
#           in your configuration.yaml
#
# Data source: ResMed myAir custom integration (prestomation/resmed_myair_sensors)
#
# Entity ID convention (generated by the myAir integration):
#   First device registered:  sensor.cpap_*
#   Second device registered: sensor.cpap_*_2
#
# If your myAir entity IDs differ from the ones above, search and replace
# them here and in the automations. Check them at:
#   HA → Settings → Devices & Services → ResMed myAir → [device] → Entities
# =============================================================================

template:
  # ---------------------------------------------------------------------------
  # Derived sensors — usage expressed in hours (float)
  # ---------------------------------------------------------------------------
  - sensor:
      - name: "CPAP User1 Usage Hours"
        unique_id: cpap_user1_usage_hours
        unit_of_measurement: "h"
        icon: mdi:clock
        state: >
          {{ (states('sensor.cpap_usage_minutes') | float(0) / 60) | round(2) }}
        availability: >
          {{ states('sensor.cpap_usage_minutes') not in ['unknown', 'unavailable'] }}

      - name: "CPAP User2 Usage Hours"
        unique_id: cpap_user2_usage_hours
        unit_of_measurement: "h"
        icon: mdi:clock
        state: >
          {{ (states('sensor.cpap_usage_minutes_2') | float(0) / 60) | round(2) }}
        availability: >
          {{ states('sensor.cpap_usage_minutes_2') not in ['unknown', 'unavailable'] }}

  # ---------------------------------------------------------------------------
  # Binary sensors — alert thresholds (ResMed myAir Guide clinical reference)
  #   AHI > 5 ev/h    → apnea not well controlled
  #   Leak > 24 L/min → mask seal inadequate (95th-percentile reference)
  #   Usage < 4h      → below minimum recommended therapy duration
  #   Score < 70      → informational low score (non-critical)
  #
  # Thresholds are read from input_numbers so they can be adjusted via the UI
  # without touching this file.
  # ---------------------------------------------------------------------------
  - binary_sensor:
      - name: "CPAP User1 AHI Alert"
        unique_id: cpap_user1_ahi_alert
        device_class: problem
        icon: mdi:heart-pulse
        state: >
          {{ states('sensor.cpap_ahi_events_per_hour') | float(0) >
             states('input_number.cpap_ahi_threshold') | float(5) }}
        availability: >
          {{ states('sensor.cpap_ahi_events_per_hour') not in ['unknown', 'unavailable'] }}

      - name: "CPAP User1 Leak Alert"
        unique_id: cpap_user1_leak_alert
        device_class: problem
        icon: mdi:air-filter
        state: >
          {{ states('sensor.cpap_mask_leak') | float(0) >
             states('input_number.cpap_leak_threshold') | float(24) }}
        availability: >
          {{ states('sensor.cpap_mask_leak') not in ['unknown', 'unavailable'] }}

      - name: "CPAP User1 Usage Alert"
        unique_id: cpap_user1_usage_alert
        device_class: problem
        icon: mdi:clock-alert
        state: >
          {% set mins = states('sensor.cpap_usage_minutes') | float(-1) %}
          {{ mins >= 0 and mins < (states('input_number.cpap_usage_min_hours') | float(4) * 60) }}
        availability: >
          {{ states('sensor.cpap_usage_minutes') not in ['unknown', 'unavailable'] }}

      - name: "CPAP User1 Score Low"
        unique_id: cpap_user1_score_low
        device_class: problem
        icon: mdi:star-alert
        state: >
          {{ states('sensor.cpap_total_myair_score') | float(100) <
             states('input_number.cpap_score_threshold') | float(70) }}
        availability: >
          {{ states('sensor.cpap_total_myair_score') not in ['unknown', 'unavailable'] }}

      - name: "CPAP User2 AHI Alert"
        unique_id: cpap_user2_ahi_alert
        device_class: problem
        icon: mdi:heart-pulse
        state: >
          {{ states('sensor.cpap_ahi_events_per_hour_2') | float(0) >
             states('input_number.cpap_ahi_threshold') | float(5) }}
        availability: >
          {{ states('sensor.cpap_ahi_events_per_hour_2') not in ['unknown', 'unavailable'] }}

      - name: "CPAP User2 Leak Alert"
        unique_id: cpap_user2_leak_alert
        device_class: problem
        icon: mdi:air-filter
        state: >
          {{ states('sensor.cpap_mask_leak_2') | float(0) >
             states('input_number.cpap_leak_threshold') | float(24) }}
        availability: >
          {{ states('sensor.cpap_mask_leak_2') not in ['unknown', 'unavailable'] }}

      - name: "CPAP User2 Usage Alert"
        unique_id: cpap_user2_usage_alert
        device_class: problem
        icon: mdi:clock-alert
        state: >
          {% set mins = states('sensor.cpap_usage_minutes_2') | float(-1) %}
          {{ mins >= 0 and mins < (states('input_number.cpap_usage_min_hours') | float(4) * 60) }}
        availability: >
          {{ states('sensor.cpap_usage_minutes_2') not in ['unknown', 'unavailable'] }}

      - name: "CPAP User2 Score Low"
        unique_id: cpap_user2_score_low
        device_class: problem
        icon: mdi:star-alert
        state: >
          {{ states('sensor.cpap_total_myair_score_2') | float(100) <
             states('input_number.cpap_score_threshold') | float(70) }}
        availability: >
          {{ states('sensor.cpap_total_myair_score_2') not in ['unknown', 'unavailable'] }}

# -----------------------------------------------------------------------------
# Configurable thresholds — adjust via HA UI without touching YAML
# -----------------------------------------------------------------------------
input_number:
  cpap_ahi_threshold:
    name: "CPAP AHI Alert Threshold"
    min: 1
    max: 30
    step: 0.5
    initial: 5.0
    unit_of_measurement: "events/h"
    icon: mdi:heart-pulse
    mode: box

  cpap_leak_threshold:
    name: "CPAP Mask Leak Alert Threshold"
    min: 10
    max: 60
    step: 1
    initial: 24
    unit_of_measurement: "L/min"
    icon: mdi:air-filter
    mode: box

  cpap_usage_min_hours:
    name: "CPAP Minimum Usage Hours"
    min: 1
    max: 8
    step: 0.5
    initial: 4
    unit_of_measurement: "h"
    icon: mdi:clock-check
    mode: box

  cpap_score_threshold:
    name: "CPAP myAir Score Threshold"
    min: 30
    max: 100
    step: 5
    initial: 70
    unit_of_measurement: "points"
    icon: mdi:star
    mode: box

  # ---------------------------------------------------------------------------
  # Acumulador do relatório mensal (User1) — ver automations/cpap_month_*.yaml
  # O recorder do HA só guarda purge_keep_days (10 dias) de histórico bruto, o
  # que é curto demais para calcular uma média de 30 dias depois do fato. Em vez
  # disso, cpap_month_accumulate.yaml soma cada noite nova a estes totais, e
  # cpap_monthly_report.yaml lê a média no dia 1 e zera tudo para o próximo mês.
  # SEM `initial:` de propósito: com initial definido o HA volta o valor ao
  # inicial a cada restart e zera o acumulador (bug real em set-out/2026).
  # ---------------------------------------------------------------------------
  cpap_month_usage_minutes_sum:
    name: "CPAP Mês — soma de minutos de uso"
    min: 0
    max: 50000
    step: 0.1
    mode: box

  cpap_month_ahi_sum:
    name: "CPAP Mês — soma de IAH"
    min: 0
    max: 3000
    step: 0.1
    mode: box

  cpap_month_leak_sum:
    name: "CPAP Mês — soma de vazamento"
    min: 0
    max: 6000
    step: 0.1
    mode: box

  cpap_month_nights_count:
    name: "CPAP Mês — noites com dados"
    min: 0
    max: 31
    step: 1
    mode: box

  cpap_month_nights_ge4h:
    name: "CPAP Mês — noites com uso ≥4h"
    min: 0
    max: 31
    step: 1
    mode: box

  cpap_month_nights_ge6h:
    name: "CPAP Mês — noites com uso ≥6h"
    min: 0
    max: 31
    step: 1
    mode: box

input_boolean:
  cpap_alerts_user1:
    name: "CPAP Alertas — Maria"
    icon: mdi:bell

  cpap_alerts_user2:
    name: "CPAP Alertas — João"
    icon: mdi:bell

  cpap_telegram_family_notify:
    name: "CPAP Aviso Telegram — Família"
    icon: mdi:send-circle

input_text:
  cpap_telegram_family_last_sent:
    name: "CPAP Telegram Família — última noite enviada"
    icon: mdi:calendar-check
    max: 20

  cpap_user1_no_data_alerted_date:
    name: "CPAP Maria — data do último aviso de 'sem dados'"
    icon: mdi:calendar-alert
    max: 20

  cpap_user2_no_data_alerted_date:
    name: "CPAP João — data do último aviso de 'sem dados'"
    icon: mdi:calendar-alert
    max: 20

  # ---------------------------------------------------------------------------
  # Acumulador do relatório mensal (User1) — ver automations/cpap_month_*.yaml
  # ---------------------------------------------------------------------------
  cpap_month_last_accumulated_date:
    name: "CPAP Mês — última noite já somada ao acumulador"
    icon: mdi:calendar-check
    max: 20

  cpap_month_period_start:
    name: "CPAP Mês — primeira noite do período acumulado"
    icon: mdi:calendar-start
    max: 20
